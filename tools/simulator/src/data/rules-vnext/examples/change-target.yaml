actions:
  - id: action.changeTarget
    name: 対象変更
    ruby: たいしょうへんこう
    type: magic

    request:
      trigger: direct
      speed: normal
      timing: quick

    key:
      id: keys
      count: 2
      condition:
        card:
          suit: club
          rank: "A..10"
          zone: hand

    targets:
      - id: targetRequest
        type: request
        condition:
          hasTarget: true

    text:
      effect: 対象のリクエストで指定されている対象をそのアクションが指定できる範囲で変更する。

    effect:
      - selectActionTarget:
          id: replacementTarget
          request: targetRequest
          decisionPlayer: self

      - replaceRequestTarget:
          request: targetRequest
          selection: replacementTarget
