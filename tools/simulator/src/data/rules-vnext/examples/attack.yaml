actions:
  - id: action.attack
    name: アタック
    ruby: あたっく
    type: basic

    request:
      trigger: direct
      speed: normal
      timing: main

    targets:
      - id: targetPlayer
        type: player
        condition:
          relation: opponent

    text:
      effect: 対戦相手を攻撃するアタッカーをドライブして指定する。

    effect:
      - selectUnits:
          id: attackers
          relation: self
          condition:
            label: 攻撃
            state: charge
            componentType: character
      - startAttack:
          attackers: selection.attackers
          defender: targetPlayer
