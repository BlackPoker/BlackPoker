actions:
  - id: action.search
    name: サーチ
    ruby: さーち
    type: magic

    request:
      trigger: direct
      speed: immediate
      timing: quick

    key:
      id: key
      condition:
        card:
          rank: "Joker"
          zone: hand

    text:
      effect: ライフから好きなカードを1枚選び対戦相手に見せ手札に加える。その後ライフをシャッフルする。

    effect:
      - selectCards:
          id: searchCard
          zone: life
          count: 1
          chooser: self
      - revealCard:
          card: selection.searchCard
          target: opponent
          sourceZone: life
      - moveCard:
          card: selection.searchCard
          from: life
          to: hand
      - shuffleZone:
          zone: life
          player: self
