actions:
  - id: action.setBulwark
    name: 防壁設置
    ruby: ぼうへきせっち
    type: summon

    request:
      trigger: direct
      speed: immediate
      timing: main
      usageLimit:
        scope: turn
        max: 1

    cost: L

    text:
      effect: 手札からカード1枚を防壁として裏向きかつチャージ状態で場に出す。防壁の置き方は「防壁の置き方」参照。

    effect:
      - selectCards:
          id: bulwarkCard
          count: 1
          zone: hand
          condition:
            component: character.bulwark
      - summonUnit:
          card: selection.bulwarkCard
          component: character.bulwark
          face: down
          state: charge

