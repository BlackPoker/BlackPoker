actions:
  - id: action.block
    name: ブロック
    ruby: ぶろっく
    type: basic

    request:
      trigger: triggered
      speed: normal
      timing: main
      controller: turnPlayer
      definitionOwner: turnPlayer
      initialChance: turnPlayer

    triggerCondition:
      event: actionResolved
      condition:
        actionId: action.attack
        hasAttacker: true

    text:
      effect: アタッカー毎にそれをブロックするキャラクター（ブロッカー）を指定する。

    effect:
      - selectBlockAssignments:
          id: blocks
          decisionPlayer: opponent
          relation: decisionPlayer
          attackers: battle.attackers
          condition:
            label: 防御
            state: charge
            componentType: character
      - declareBlock:
          assignments: selection.blocks
