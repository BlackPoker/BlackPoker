components:
  - id: trump.fortress
    name: 要塞
    ruby: ようさい
    type: trump
    zone: trump
    card:
      suit: club
      rank: "9"
    face: up

    abilities:
      - preventDamage:
          source:
            requestController: opponent
            keyCardsIncludeSuit: spade
          condition:
            exists:
              zone: field
              controller: self
              componentType: character
          target: self

actions:
  - id: action.counterattack
    name: 反撃
    ruby: はんげき
    type: triggered

    request:
      trigger: triggered
      speed: immediate
      timing: quick

    triggerCondition:
      event: cardMoved
      condition:
        fromZone: field
        toZone: grave
        characterType: bulwark
        cause:
          actionId: action.damageJudge
        combat:
          role: blocker
        activeComponent:
          relation: self
          zone: trump
          component: trump.fortress
          face: up

    text:
      effect: アタッカーのオーナーに2点のダメージを与える。

    effect:
      - dealDamage:
          target: sourceEvent.payload.combat.attackerPlayerKey
          amount: 2
