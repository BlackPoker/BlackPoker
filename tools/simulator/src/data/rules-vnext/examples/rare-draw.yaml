actions:
  - id: action.rareDraw
    name: レアドロー
    ruby: れあどろー
    type: rareCardOperation

    request:
      trigger: direct
      speed: immediate
      timing: quick

    activationCondition:
      all:
        - zoneCount:
            player: controller
            zone: life
            atMost: 9
        - zoneCount:
            player: controller
            zone: rare
            atLeast: 1

    text:
      summary: レアカードを1枚手札に加える。
      effect: レアカードを1枚手札に加える。

    effect:
      - moveCard:
          from: rare
          to: hand
