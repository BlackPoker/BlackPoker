components:
  - id: character.soldier
    name: 一般兵
    ruby: いっぱんへい
    type: character
    zone: field
    display:
      kind: 一般兵

    unitCondition:
      cards:
        count: 1
        rank: "2..10"
      face: up

    properties:
      characterType: soldier
      size: unit.cards[0].rankValue
      labels: [attack, defense]
      eligibleAsPresetSoldier: true

    text:
      summary: 数字2〜10のカードは一般兵として扱う。

  - id: character.hero
    name: 英雄
    ruby: えいゆう
    type: character
    zone: field
    display:
      kind: 英雄

    unitCondition:
      cards:
        count: 1
        rank: "J..K"
      face: up

    properties:
      characterType: soldier
      size: unit.cards[0].rankValue
      labels: [attack, defense]
      eligibleAsPresetSoldier: true

    text:
      summary: 絵札J〜Kのカードは英雄として扱う。

  - id: character.ace
    name: エース
    ruby: えーす
    type: character
    zone: field
    display:
      kind: エース

    unitCondition:
      cards:
        count: 1
        rank: "A"
      face: up

    properties:
      characterType: soldier
      size: 1
      labels: [attack, defense, haste]
      eligibleAsPresetSoldier: true

    text:
      summary: Aのカードはエースとして扱う。速攻を持つ。

  - id: character.armedSoldier
    name: 装備兵
    ruby: そうびへい
    type: character
    zone: field
    display:
      kind: 装備兵

    unitCondition:
      cards:
        minCount: 2
      face: up

    properties:
      characterType: soldier
      labels: [attack, defense]
      eligibleAsPresetSoldier: false

    text:
      summary: 兵士の上にカードを装備した状態の兵士。

  - id: fog.up
    name: アップ
    type: fog
    zone: fog

    text:
      ability: 対象とした兵士のサイズは、このターンが終わるまでキーカードの数字分加算される。

    abilities:
      - sizeModifier:
          target: binding.target
          amount: binding.amount

  - id: fog.down
    name: ダウン
    type: fog
    zone: fog

    text:
      ability: 対象とした兵士のサイズは、このターンが終わるまでキーカードの数字分減算される。

    abilities:
      - sizeModifier:
          target: binding.target
          amount: binding.amount

  - id: character.bulwark
    name: 防壁
    ruby: ぼうへき
    type: character
    zone: field
    display:
      kind: 防壁

    unitCondition:
      cards:
        count: 1
      face: down

    properties:
      characterType: bulwark
      labels: [defense]

    text:
      summary: 任意のカード1枚を裏向きにしたユニットは防壁として扱う。
