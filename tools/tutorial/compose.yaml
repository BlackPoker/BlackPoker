services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /repo/tools/tutorial
    volumes:
      - ../..:/repo
      - node_modules:/repo/tools/tutorial/node_modules
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
