name: refresh_docs

# vから始まるタグが付いたら実行する（例: v1, v1.2, v1.2.3）←現在動作していない
on:
  workflow_dispatch:
    inputs:
      logLevel:
        required: true
        description: ログレベル
        default: warning
      tags:
  schedule:
    # 日本時間AM4:00に動作
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  release:
    name: release build
    runs-on: ubuntu-latest

    steps:
      # 変数設定
      - name: Set output
        id: vars
        run: |
          echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
          echo "::set-output name=short_ref::${GITHUB_REF#refs/*/}"

      # 準備
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: main
#         with:
#           ref: ${{ github.head_ref }}
#           ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: clear
        run: rm -rf ./main/dist/*
    
      # アクションリスト生成
      - name: build builder image
        working-directory: ./main/tools/actionlist
        env:
          DOCKER_BUILDKIT: 1
        run: |
           mkdir -p `pwd`/dist/web-site
           docker build --pull --rm -f "Dockerfile" -t actionlist:latest "."
           docker run --rm --user $UID -v `pwd`/dist:/dist actionlist:latest
            
#       # sphinx実行
#       - name: Set up Python ${{ matrix.python-version }}
#         uses: actions/setup-python@v2
#         with:
#           python-version: ${{ matrix.python-version }}
#       - name: Install dependencies
#         run: |
#           python -m pip install --upgrade pip
#           pip install flake8 pytest
#           if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
#       - name: execute sphinx
#         run: sphinx-build -b html ./source ./docs  
        
      # HTML,PDF生成(sphix実行)
      - name: build builder image
        working-directory: ./main
        env:
          DOCKER_BUILDKIT: 1
        run: |
           cp -r ./tools/actionlist/dist/source/auto/* ./source/auto/
           cp ./tools/actionlist/original/version.json ./source/version.json
           sed -i -e 's,'\''github_version'\'': '\''master/source/'\'','\''github_version'\'': '\''${{ steps.vars.outputs.short_ref }}/source/'\'',g' ./source/conf.py
           cat ./source/conf.py
           sed -i -e 's,https://blackpoker.github.io/BlackPoker/,https://blackpoker.github.io/BlackPoker/${{ steps.vars.outputs.short_ref }}/,g' ./source/appendix/*.rst
           mkdir -p `pwd`/docs
           docker build --pull --rm -f "Dockerfile" -t blackpoker-doc:latest "."
           docker run --rm --user $UID -v `pwd`/docs:/docs blackpoker-doc:latest

      # gh-pageに反映 (ActionList)
      - name: copy actionlist docs
        working-directory: ./main
        run: |
          mkdir -p ./docs/actionlist/html
          mkdir -p ./docs/actionlist/pdf
          cp -r ./tools/actionlist/dist/web-site/static/* docs/actionlist/html
          cp -r ./tools/actionlist/dist/blackpoker-*.pdf docs/actionlist/pdf

      # Simulator のビルド & docs/playtest への反映
      - name: Setup Node.js for Simulator
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./main/tools/simulator/package-lock.json

      - name: Test, verify and build Simulator
        working-directory: ./main/tools/simulator
        env:
          VITE_BASE_PATH: /BlackPoker/${{ steps.vars.outputs.short_ref }}/playtest/
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: ${{ steps.vars.outputs.short_ref }}
        run: |
          npm ci
          npm test
          npm run playable:check
          npm run build

      - name: copy simulator to docs
        working-directory: ./main
        run: |
          mkdir -p ./docs/playtest
          cp -r ./tools/simulator/dist/* ./docs/playtest/

      - name: checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          
      - name: copy docs
        working-directory: ./
        run: |
          pwd
          ls -la
          mkdir ../tmp_docs
          mv ./main/docs/* ../tmp_docs/.
          rm -rf ./pages/${{ steps.vars.outputs.short_ref }}
          mkdir -p ./pages/${{ steps.vars.outputs.short_ref }}
          mv ../tmp_docs/* ./pages/${{ steps.vars.outputs.short_ref }}/.
          ls -la ./main
          ls -la ./pages
          cd ./pages
          git config --global user.email "blackpoker.official@gmail.com"
          git config --global user.name "BlackPoker"
          git config -l
          git status
          git add .
          if git diff --staged --quiet; then
            echo "No changes in docs."
          else
            git commit -m "refresh docs" -a
            for i in {1..5}; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break || {
                echo "Push failed, retrying in 3s... (attempt $i)"
                sleep 3
              }
            done
          fi

