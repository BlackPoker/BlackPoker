name: refresh_docs

# vから始まるタグが付いたら実行する（例: v1, v1.2, v1.2.3）←現在動作していない
on:
  workflow_dispatch:
    inputs:
      simulator_mode:
        description: "Simulatorの処理"
        required: true
        type: choice
        options:
          - skip
          - build-only
          - verify-and-build
        default: skip
      logLevel:
        required: false
        description: ログレベル
        default: warning
      tags:
        required: false
        description: タグ
  schedule:
    # 日本時間AM4:00に動作
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. 公式ルール・ActionList のビルドジョブ
  # =========================================================================
  build-rules:
    name: build rules & actionlist
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 変数設定 (short_ref)
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # 準備
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: main
#         with:
#           ref: ${{ github.head_ref }}
#           ssh-key: ${{ secrets.DEPLOY_KEY }}
      - name: clear
        run: rm -rf ./main/dist/*
    
      # アクションリスト生成
      - name: build builder image
        working-directory: ./main/tools/actionlist
        env:
          DOCKER_BUILDKIT: 1
        run: |
           mkdir -p `pwd`/dist/web-site
           docker build --pull --rm -f "Dockerfile" -t actionlist:latest "."
           docker run --rm --user $UID -v `pwd`/dist:/dist actionlist:latest
            
#       # sphinx実行
#       - name: Set up Python ${{ matrix.python-version }}
#         uses: actions/setup-python@v2
#         with:
#           python-version: ${{ matrix.python-version }}
#       - name: Install dependencies
#         run: |
#           python -m pip install --upgrade pip
#           pip install flake8 pytest
#           if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
#       - name: execute sphinx
#         run: sphinx-build -b html ./source ./docs  
        
      # HTML,PDF生成(sphix実行)
      - name: build builder image
        working-directory: ./main
        env:
          DOCKER_BUILDKIT: 1
        run: |
           cp -r ./tools/actionlist/dist/source/auto/* ./source/auto/
           cp ./tools/actionlist/original/version.json ./source/version.json
           sed -i -e 's,'\''github_version'\'': '\''master/source/'\'','\''github_version'\'': '\''${{ steps.vars.outputs.short_ref }}/source/'\'',g' ./source/conf.py
           cat ./source/conf.py
           sed -i -e 's,https://blackpoker.github.io/BlackPoker/,https://blackpoker.github.io/BlackPoker/${{ steps.vars.outputs.short_ref }}/,g' ./source/appendix/*.rst
           mkdir -p `pwd`/docs
           docker build --pull --rm -f "Dockerfile" -t blackpoker-doc:latest "."
           docker run --rm --user $UID -v `pwd`/docs:/docs blackpoker-doc:latest

      # gh-pageに反映 (ActionList)
      - name: copy actionlist docs
        working-directory: ./main
        run: |
          mkdir -p ./docs/actionlist/html
          mkdir -p ./docs/actionlist/pdf
          cp -r ./tools/actionlist/dist/web-site/static/* docs/actionlist/html
          cp -r ./tools/actionlist/dist/blackpoker-*.pdf docs/actionlist/pdf

      # rules docs artifact のアップロード
      - name: upload rules docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rules-docs
          path: ./main/docs
          retention-days: 1

  # =========================================================================
  # 2. Simulator の検証・ビルドジョブ
  # =========================================================================
  test-and-build-simulator:
    name: test & build simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_dispatch' || inputs.simulator_mode != 'skip'

    steps:
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for Simulator
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./tools/simulator/package-lock.json

      - name: Install Simulator dependencies
        working-directory: ./tools/simulator
        timeout-minutes: 10
        run: npm ci

      - name: Test Simulator
        if: github.event_name != 'workflow_dispatch' || inputs.simulator_mode == 'verify-and-build'
        working-directory: ./tools/simulator
        timeout-minutes: 10
        run: npm test

      - name: Check playable match
        if: github.event_name != 'workflow_dispatch' || inputs.simulator_mode == 'verify-and-build'
        working-directory: ./tools/simulator
        timeout-minutes: 10
        run: npm run playable:check

      - name: Build Simulator
        working-directory: ./tools/simulator
        timeout-minutes: 10
        env:
          VITE_BASE_PATH: /BlackPoker/${{ steps.vars.outputs.short_ref }}/playtest/
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: ${{ steps.vars.outputs.short_ref }}
        run: npm run build

      # simulator docs artifact のアップロード
      - name: upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-docs
          path: ./tools/simulator/dist
          retention-days: 1

  # =========================================================================
  # 3. gh-pages への一括デプロイジョブ
  # =========================================================================
  publish:
    name: publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-rules, test-and-build-simulator]
    if: always() && needs.build-rules.result == 'success'

    steps:
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: download rules docs artifact
        uses: actions/download-artifact@v4
        with:
          name: rules-docs
          path: temp_docs

      - name: download simulator artifact (if simulator succeeded)
        if: needs.test-and-build-simulator.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: simulator-docs
          path: temp_docs/playtest

      - name: copy docs to gh-pages and push
        working-directory: ./
        run: |
          pwd
          ls -la
          # Simulator が成功していない場合、既存の正常な playtest があれば temp_docs/playtest に退避して維持
          if [ "${{ needs.test-and-build-simulator.result }}" != "success" ] && [ -d "./pages/${{ steps.vars.outputs.short_ref }}/playtest" ]; then
            echo "Preserving existing playtest directory..."
            cp -r "./pages/${{ steps.vars.outputs.short_ref }}/playtest" temp_docs/
          fi
          rm -rf ./pages/${{ steps.vars.outputs.short_ref }}
          mkdir -p ./pages/${{ steps.vars.outputs.short_ref }}
          mv temp_docs/* ./pages/${{ steps.vars.outputs.short_ref }}/.
          ls -la ./pages/${{ steps.vars.outputs.short_ref }}
          cd ./pages
          git config --global user.email "blackpoker.official@gmail.com"
          git config --global user.name "BlackPoker"
          git config -l
          git status
          git add .
          if git diff --staged --quiet; then
            echo "No changes in docs."
          else
            git commit -m "refresh docs" -a
            for i in {1..5}; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break || {
                echo "Push failed, retrying in 3s... (attempt $i)"
                sleep 3
              }
            done
          fi

