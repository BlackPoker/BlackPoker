name: refresh_docs

on:
  push:
    branches-ignore:
      - gh-pages
    paths:
      - "tools/simulator/**"
      - "!tools/simulator/dist/**"
  workflow_dispatch:
    inputs:
      deploy_scope:
        description: "デプロイ対象"
        required: true
        type: choice
        options:
          - full
          - simulator-only
        default: full
      simulator_mode:
        description: "Simulatorの処理 (deploy_scopeがfullの場合のみ有効)"
        required: true
        type: choice
        options:
          - skip
          - build-only
          - verify-and-build
        default: skip
      logLevel:
        required: false
        description: ログレベル
        default: warning
      tags:
        required: false
        description: タグ
  schedule:
    # 日本時間AM4:00に動作
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. 公式ルール・ActionList のビルドジョブ
  # =========================================================================
  build-rules:
    name: build rules & actionlist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name != 'push' &&
      (
        github.event_name != 'workflow_dispatch' ||
        inputs.deploy_scope != 'simulator-only'
      )

    steps:
      # 変数設定 (short_ref)
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      # 準備
      - name: checkout
        uses: actions/checkout@v4
        with:
          path: main
      - name: clear
        run: rm -rf ./main/dist/*
    
      # アクションリスト生成
      - name: build builder image
        working-directory: ./main/tools/actionlist
        env:
          DOCKER_BUILDKIT: 1
        run: |
           mkdir -p `pwd`/dist/web-site
           docker build --pull --rm -f "Dockerfile" -t actionlist:latest "."
           docker run --rm --user $UID -v `pwd`/dist:/dist actionlist:latest
            
      # HTML,PDF生成(sphix実行)
      - name: build builder image
        working-directory: ./main
        env:
          DOCKER_BUILDKIT: 1
        run: |
           cp -r ./tools/actionlist/dist/source/auto/* ./source/auto/
           cp ./tools/actionlist/original/version.json ./source/version.json
           sed -i -e 's,'\''github_version'\'': '\''master/source/'\'','\''github_version'\'': '\''${{ steps.vars.outputs.short_ref }}/source/'\'',g' ./source/conf.py
           cat ./source/conf.py
           sed -i -e 's,https://blackpoker.github.io/BlackPoker/,https://blackpoker.github.io/BlackPoker/${{ steps.vars.outputs.short_ref }}/,g' ./source/appendix/*.rst
           mkdir -p `pwd`/docs
           docker build --pull --rm -f "Dockerfile" -t blackpoker-doc:latest "."
           docker run --rm --user $UID -v `pwd`/docs:/docs blackpoker-doc:latest

      # gh-pageに反映 (ActionList)
      - name: copy actionlist docs
        working-directory: ./main
        run: |
          mkdir -p ./docs/actionlist/html
          mkdir -p ./docs/actionlist/pdf
          cp -r ./tools/actionlist/dist/web-site/static/* docs/actionlist/html
          cp -r ./tools/actionlist/dist/blackpoker-*.pdf docs/actionlist/pdf

      # rules docs artifact のアップロード
      - name: upload rules docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rules-docs
          path: ./main/docs
          retention-days: 1

  # =========================================================================
  # 2. Simulator の検証・ビルドジョブ
  # =========================================================================
  test-and-build-simulator:
    name: test & build simulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'simulator-only') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'full' && inputs.simulator_mode != 'skip') ||
      github.event_name == 'schedule'

    steps:
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for Simulator
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./tools/simulator/package-lock.json

      - name: Install Simulator dependencies
        working-directory: ./tools/simulator
        timeout-minutes: 10
        run: npm ci

      - name: Test Simulator
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'simulator-only') ||
          (github.event_name == 'workflow_dispatch' && inputs.simulator_mode == 'verify-and-build') ||
          github.event_name == 'schedule'
        working-directory: ./tools/simulator
        timeout-minutes: 10
        run: npm test

      - name: Check playable match
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'simulator-only') ||
          (github.event_name == 'workflow_dispatch' && inputs.simulator_mode == 'verify-and-build') ||
          github.event_name == 'schedule'
        working-directory: ./tools/simulator
        timeout-minutes: 10
        run: npm run playable:check

      - name: Build Simulator
        working-directory: ./tools/simulator
        timeout-minutes: 10
        env:
          VITE_BASE_PATH: /BlackPoker/${{ steps.vars.outputs.short_ref }}/playtest/
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_REF: ${{ steps.vars.outputs.short_ref }}
        run: npm run build

      # simulator docs artifact のアップロード
      - name: upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulator-docs
          path: ./tools/simulator/dist
          retention-days: 1

  # =========================================================================
  # 3. gh-pages へのデプロイジョブ
  # =========================================================================
  publish:
    name: publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-rules, test-and-build-simulator]
    if: |
      always() && (
        (
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'simulator-only')) &&
          needs.test-and-build-simulator.result == 'success'
        ) ||
        (
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'full')) &&
          needs.build-rules.result == 'success'
        )
      )

    steps:
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT

      - name: checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      # Full モード時のみ rules artifact をダウンロード
      - name: download rules docs artifact
        if: needs.build-rules.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: rules-docs
          path: temp_docs

      # Simulator 成功時に simulator artifact をダウンロード
      - name: download simulator artifact
        if: needs.test-and-build-simulator.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: simulator-docs
          path: temp_simulator

      # 【Simulator-only デプロイ】
      # 既存の公式ルールや ActionList には一切触れず、対応ブランチの playtest/ のみを入れ替える
      - name: publish simulator only to gh-pages
        if: |
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'simulator-only')) &&
          needs.test-and-build-simulator.result == 'success'
        working-directory: ./
        run: |
          SHORT_REF="${{ steps.vars.outputs.short_ref }}"
          mkdir -p "./pages/${SHORT_REF}"
          rm -rf "./pages/${SHORT_REF}/playtest"
          mkdir -p "./pages/${SHORT_REF}/playtest"
          cp -a temp_simulator/. "./pages/${SHORT_REF}/playtest/"

          cd ./pages
          git config --global user.email "blackpoker.official@gmail.com"
          git config --global user.name "BlackPoker"
          git status
          git add .
          if git diff --staged --quiet; then
            echo "No changes in playtest."
          else
            git commit -m "update playtest (${SHORT_REF})" -a
            for i in {1..5}; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break || {
                echo "Push failed, retrying in 3s... (attempt $i)"
                sleep 3
              }
            done
          fi

      # 【Full デプロイ】
      # 公式ルール + (Simulator成功時 playtest) を一括更新
      - name: publish full docs to gh-pages
        if: |
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy_scope == 'full')) &&
          needs.build-rules.result == 'success'
        working-directory: ./
        run: |
          SHORT_REF="${{ steps.vars.outputs.short_ref }}"

          # Simulator が成功している場合は temp_docs/playtest に配置
          if [ "${{ needs.test-and-build-simulator.result }}" == "success" ] && [ -d "temp_simulator" ]; then
            mkdir -p temp_docs/playtest
            cp -a temp_simulator/. temp_docs/playtest/
          elif [ -d "./pages/${SHORT_REF}/playtest" ]; then
            # Simulator が失敗またはスキップされた場合、既存の正常な playtest を維持
            echo "Preserving existing playtest directory..."
            mkdir -p temp_docs/playtest
            cp -a "./pages/${SHORT_REF}/playtest/." temp_docs/playtest/
          fi

          rm -rf "./pages/${SHORT_REF}"
          mkdir -p "./pages/${SHORT_REF}"
          mv temp_docs/* "./pages/${SHORT_REF}/."

          cd ./pages
          git config --global user.email "blackpoker.official@gmail.com"
          git config --global user.name "BlackPoker"
          git status
          git add .
          if git diff --staged --quiet; then
            echo "No changes in docs."
          else
            git commit -m "refresh docs (${SHORT_REF})" -a
            for i in {1..5}; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break || {
                echo "Push failed, retrying in 3s... (attempt $i)"
                sleep 3
              }
            done
          fi
