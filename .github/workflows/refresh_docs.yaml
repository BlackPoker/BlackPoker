name: refresh_docs

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: ログレベル
        required: true
        default: warning
      tags:
        description: master公開時に指定する正式リリースタグ (vX.Y.Z)
        type: string
  schedule:
    - cron: '0 19 * * *'
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: build rule site
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 公開先と生成元を確認
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tags }}
          SOURCE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            exit 0
          fi
          target=$(python3 tools/dev/docs-target.py "$GITHUB_REF")
          bash tools/dev/check-docs-source.sh "$SOURCE_REMOTE" "$GITHUB_REF" "$GITHUB_SHA" "$RELEASE_TAG"
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"
          export DOCS_TARGET="$target"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import quote

          branch = quote(os.environ["GITHUB_REF_NAME"], safe="/")
          target = quote(os.environ["DOCS_TARGET"], safe="/")
          conf = Path("source/conf.py")
          conf.write_text(conf.read_text().replace("'master/source/'", f"'{branch}/source/'"))
          for path in Path("source/appendix").glob("*.rst"):
              base = "https://blackpoker.github.io/BlackPoker/"
              # 公開先の指定がない既存リンクだけを、このビルドの公開先に向ける。
              text = path.read_text()
              for prefix in ("actionlist/", "blackpoker"):
                  text = text.replace(base + prefix, f"{base}{target}/{prefix}")
              path.write_text(text)
          PY
      - name: アクションリスト生成
        working-directory: tools/actionlist
        run: |
          mkdir -p dist/web-site
          docker build --pull --rm -t actionlist:latest .
          docker run --rm --user "$UID" -v "$PWD/dist:/dist" actionlist:latest
      - name: HTMLとPDFを生成
        run: |
          cp -r tools/actionlist/dist/source/auto/. source/auto/
          cp tools/actionlist/original/version.json source/version.json
          mkdir site-output
          docker build --pull --rm -t blackpoker-doc:latest .
          docker run --rm --user "$UID" -v "$PWD/site-output:/docs" blackpoker-doc:latest
          mkdir -p site-output/actionlist/{html,pdf}
          cp -r tools/actionlist/dist/web-site/static/. site-output/actionlist/html/
          cp tools/actionlist/dist/blackpoker-*.pdf site-output/actionlist/pdf/
          test -s site-output/index.html
          test -s site-output/blackpoker.pdf
          test -s site-output/actionlist/html/all.html
          printf '%s\n' "$GITHUB_SHA" > site-output/build-sha.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rule-site
          path: site-output/
          if-no-files-found: error

  publish:
    name: publish rule site
    needs: build
    if: github.event_name != 'pull_request' && needs.build.outputs.target != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: blackpoker-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: source-repo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - uses: actions/download-artifact@v4
        with:
          name: rule-site
          path: site-output
      - name: 検証済みの成果物を公開
        env:
          DOCS_TARGET: ${{ needs.build.outputs.target }}
          RELEASE_TAG: ${{ inputs.tags }}
          SOURCE_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: bash source-repo/tools/dev/publish-docs.sh
