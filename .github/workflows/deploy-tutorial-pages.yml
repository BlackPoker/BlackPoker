name: deploy_tutorial_pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tutorial/**"
      - "tools/actionlist/original/act.yaml"
      - "tools/actionlist/original/frame.yaml"
      - "tools/simulator/src/data/rules-vnext/official-base.yaml"
      - ".github/workflows/deploy-tutorial-pages.yml"

permissions:
  contents: write

concurrency:
  group: tutorial-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpmを準備
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: pnpmキャッシュを有効化
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tutorial/pnpm-lock.yaml

      - name: 依存関係をインストール
        working-directory: tutorial
        run: pnpm install --frozen-lockfile

      - name: テスト
        working-directory: tutorial
        run: pnpm test

      - name: GitHub Pages向けにビルド
        working-directory: tutorial
        env:
          VITE_BASE_PATH: /BlackPoker/tutorial/
        run: pnpm build

      - name: gh-pagesへ配置
        shell: bash
        run: |
          git clone --branch gh-pages --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          rm -rf pages/tutorial
          mkdir -p pages/tutorial
          cp -R tutorial/dist/. pages/tutorial/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorial
          git diff --cached --quiet || git commit -m "docs: チュートリアルサイトを更新"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
