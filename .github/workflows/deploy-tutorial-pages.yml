name: deploy_tutorial_pages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - "635-kaizen-チュートリアルサイト作成"
    paths:
      - "tools/tutorial/**"
      - "tools/actionlist/original/act.yaml"
      - "tools/actionlist/original/frame.yaml"
      - ".github/workflows/deploy-tutorial-pages.yml"

permissions:
  contents: write

concurrency:
  group: tutorial-pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: 依存関係をインストール
        working-directory: tools/tutorial
        run: docker compose run --rm app npm ci

      - name: テスト
        working-directory: tools/tutorial
        run: docker compose run --rm app npm test

      - name: GitHub Pages向けにビルド
        working-directory: tools/tutorial
        run: docker compose run --rm -e VITE_BASE_PATH=/BlackPoker/tutorial/ app npm run build

      - name: build成果物を検証
        working-directory: tools/tutorial
        shell: bash
        run: |
          test -f dist/index.html
          find dist/assets -type f -print -quit | grep -q .
          grep -q '/BlackPoker/tutorial/assets/' dist/index.html

      - name: gh-pagesへ配置
        shell: bash
        run: |
          git clone --branch gh-pages --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
          rm -rf pages/tutorial
          mkdir -p pages/tutorial
          cp -R tools/tutorial/dist/. pages/tutorial/
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorial
          git diff --cached --quiet || git commit -m "docs: チュートリアルサイトを更新"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
