name: Deploy Core Battle Playtest to gh-pages branch

on:
  push:
    branches:
      - "BlackPoker/issue551-core-flow"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/simulator/package-lock.json

      - name: Install dependencies
        working-directory: tools/simulator
        run: npm ci

      - name: Run automated test suite
        working-directory: tools/simulator
        run: npm test

      - name: Run playable match check
        working-directory: tools/simulator
        run: npm run playable:check

      - name: Build simulator bundle for /playtest/
        working-directory: tools/simulator
        run: npm run build
        env:
          VITE_BASE_PATH: /BlackPoker/playtest/
          VITE_BUILD_SHA: ${{ github.sha }}

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-branch

      - name: Deploy to playtest directory on gh-pages
        run: |
          rm -rf gh-pages-branch/playtest
          mkdir -p gh-pages-branch/playtest
          cp -r tools/simulator/dist/* gh-pages-branch/playtest/

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playtest/
          if git diff --staged --quiet; then
            echo "No changes in playtest bundle."
          else
            git commit -m "deploy: update playtest simulator (${GITHUB_SHA:0:7})"
            for i in {1..5}; do
              git pull --rebase origin gh-pages && git push origin gh-pages && break || {
                echo "Push failed, retrying in 3s... (attempt $i)"
                sleep 3
              }
            done
          fi

